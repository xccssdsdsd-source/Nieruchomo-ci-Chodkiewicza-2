<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administratora — Nieruchomości</title>
<link href="/admin.css" rel="stylesheet">
</head>
<body class="bg-sand-50 text-slate-800 min-h-screen antialiased">

<div id="login-view" class="min-h-screen flex items-center justify-center px-4">
	<form id="login-form" class="bg-white rounded-2xl shadow-lifted p-10 w-full max-w-sm space-y-5 anim-fade-in-up">
		<div class="text-center space-y-1">
			<div class="mx-auto w-11 h-11 rounded-xl bg-brand-700 text-white flex items-center justify-center font-display text-lg">P</div>
			<h1 class="font-display text-2xl font-semibold text-brand-900 mt-3">Panel administratora</h1>
			<p class="text-sm text-slate-500">Zaloguj się, aby zarządzać treścią</p>
		</div>
		<div>
			<label class="block text-sm font-medium text-slate-700 mb-1.5" for="login-email">Email</label>
			<input id="login-email" type="email" required autocomplete="username" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-[15px] outline-none transition-[box-shadow,border-color] duration-150 focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30">
		</div>
		<div>
			<label class="block text-sm font-medium text-slate-700 mb-1.5" for="login-password">Hasło</label>
			<input id="login-password" type="password" required autocomplete="current-password" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-[15px] outline-none transition-[box-shadow,border-color] duration-150 focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30">
		</div>
		<p id="login-error" role="alert" class="text-sm text-rose-600 hidden"></p>
		<button type="submit" id="login-submit" class="w-full bg-brand-700 text-white rounded-lg px-3 py-2.5 font-medium hover:bg-brand-600 active:bg-brand-800 transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 disabled:opacity-50 disabled:cursor-not-allowed">
			Zaloguj się
		</button>
	</form>
</div>

<div id="panel-view" class="hidden min-h-screen">
	<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
		<div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
			<div class="flex items-center gap-2.5 shrink-0">
				<div class="w-8 h-8 rounded-lg bg-brand-700 text-white flex items-center justify-center font-display text-sm">P</div>
				<span class="font-display text-lg font-semibold text-brand-900 hidden sm:inline">Panel nieruchomości</span>
			</div>
			<nav class="hidden md:flex items-center gap-1 bg-sand-100 rounded-full p-1" role="tablist" aria-label="Sekcje panelu">
				<button data-tab="dashboard" class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-150" role="tab">Podsumowanie</button>
				<button data-tab="properties" class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-150" role="tab">Nieruchomości</button>
				<button data-tab="reviews" class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-150" role="tab">Opinie</button>
				<button data-tab="blog" class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-150" role="tab">Blog</button>
				<button data-tab="chatbot" class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-150" role="tab">Chatbot AI</button>
			</nav>
			<div class="flex items-center gap-2 sm:gap-3">
				<button id="logout-btn" type="button" aria-label="Wyloguj" title="Wyloguj" class="inline-flex items-center justify-center w-11 h-11 rounded-lg border border-slate-200 text-slate-600 hover:text-brand-700 hover:bg-slate-100 active:bg-slate-200 transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-5"/><path d="M14 21h5a2 2 0 0 0 2-2"/></svg>
				</button>
				<button id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-nav" class="md:hidden inline-flex items-center justify-center w-11 h-11 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
				</button>
			</div>
		</div>
		<nav id="mobile-nav" class="md:hidden hidden border-t border-slate-200 bg-white anim-fade-in-up" role="tablist" aria-label="Sekcje panelu (mobile)">
			<div class="max-w-6xl mx-auto px-4 py-2 grid grid-cols-2 gap-1.5">
				<button data-tab="dashboard" class="tab-btn-mobile min-h-[44px] px-4 py-2.5 rounded-lg text-sm font-medium text-left transition-colors duration-150" role="tab">Podsumowanie</button>
				<button data-tab="properties" class="tab-btn-mobile min-h-[44px] px-4 py-2.5 rounded-lg text-sm font-medium text-left transition-colors duration-150" role="tab">Nieruchomości</button>
				<button data-tab="reviews" class="tab-btn-mobile min-h-[44px] px-4 py-2.5 rounded-lg text-sm font-medium text-left transition-colors duration-150" role="tab">Opinie</button>
				<button data-tab="blog" class="tab-btn-mobile min-h-[44px] px-4 py-2.5 rounded-lg text-sm font-medium text-left transition-colors duration-150" role="tab">Blog</button>
				<button data-tab="chatbot" class="tab-btn-mobile min-h-[44px] px-4 py-2.5 rounded-lg text-sm font-medium text-left transition-colors duration-150 col-span-2" role="tab">Chatbot AI</button>
			</div>
		</nav>
	</header>

	<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
		<section id="tab-dashboard" class="tab-panel"></section>
		<section id="tab-properties" class="tab-panel hidden"></section>
		<section id="tab-reviews" class="tab-panel hidden"></section>
		<section id="tab-blog" class="tab-panel hidden"></section>
		<section id="tab-chatbot" class="tab-panel hidden"></section>
	</main>
</div>

<div id="toast-container" aria-live="polite" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end"></div>

<div id="modal-root"></div>

<template id="tpl-dropzone">
	<div class="dropzone group relative border-2 border-dashed border-slate-300 rounded-xl p-4 text-center cursor-pointer transition-colors duration-150 hover:border-brand-400 hover:bg-brand-50/40" role="button" aria-label="Dodaj zdjęcie">
		<input type="file" accept="image/*" class="dz-input sr-only">
		<div class="dz-idle flex flex-col items-center gap-1.5 py-2 pointer-events-none">
			<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="text-slate-400 group-hover:text-brand-500 transition-colors duration-150"><path d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1M7 9l5-5 5 5M12 4v13"/></svg>
			<p class="text-sm text-slate-500"><span class="text-brand-700 font-medium">Kliknij</span> lub przeciągnij zdjęcie</p>
		</div>
		<div class="dz-loading hidden items-center justify-center gap-2 py-2 text-sm text-brand-700">
			<svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
			Przesyłanie...
		</div>
	</div>
</template>

<script>
const state = { properties: [], posts: [], reviews: [], chatbotConfig: null, chatbotDocs: [], userEmail: '' }
const $ = (sel, root = document) => root.querySelector(sel)
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel))

const statusMeta = {
	dostepna: { label: 'Dostępna', cls: 'bg-brand-100 text-brand-800' },
	zarezerwowana: { label: 'Zarezerwowana', cls: 'bg-amber-100 text-amber-800' },
	sprzedana: { label: 'Sprzedana', cls: 'bg-slate-200 text-slate-600' },
}

const fmtPrice = (value) => new Intl.NumberFormat('pl-PL').format(value) + ' zł'
const fmtDate = (value) => new Date(value).toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' })

const starsSvg = (filled) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.75" class="${filled ? 'text-gold-500' : 'text-slate-300'}"><path d="M12 2.5l3 6.5 7 .7-5.3 4.7 1.6 6.9-6.3-3.7-6.3 3.7 1.6-6.9L2 9.7l7-.7z" stroke-linejoin="round"/></svg>`
const renderStars = (rating) => `<span class="inline-flex items-center gap-0.5" role="img" aria-label="${rating} na 5 gwiazdek">${[1, 2, 3, 4, 5].map((i) => starsSvg(i <= rating)).join('')}</span>`

const showToast = (message, type = 'success') => {
	const container = $('#toast-container')
	const el = document.createElement('div')
	const styles = type === 'error' ? 'bg-rose-600 text-white' : 'bg-brand-800 text-white'
	el.className = `anim-fade-in-up ${styles} rounded-lg shadow-lifted px-4 py-2.5 text-sm font-medium max-w-sm`
	el.textContent = message
	container.appendChild(el)
	setTimeout(() => {
		el.style.transition = 'opacity 200ms ease-out, transform 200ms ease-out'
		el.style.opacity = '0'
		el.style.transform = 'translateY(4px)'
		setTimeout(() => el.remove(), 200)
	}, 4000)
}

const confirmDialog = (message) => new Promise((resolve) => {
	const root = $('#modal-root')
	root.innerHTML = `
		<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/50 anim-fade-in p-4" data-role="backdrop">
			<div class="bg-white rounded-2xl shadow-lifted p-6 w-full max-w-sm anim-scale-in" role="dialog" aria-modal="true">
				<p class="text-slate-800 mb-5">${message}</p>
				<div class="flex justify-end gap-2">
					<button data-role="cancel" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors duration-150">Anuluj</button>
					<button data-role="confirm" class="px-3.5 py-2 rounded-lg text-sm font-medium bg-rose-600 text-white hover:bg-rose-700 transition-colors duration-150">Usuń</button>
				</div>
			</div>
		</div>
	`
	const close = (result) => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(result) }
	const onKey = (e) => { if (e.key === 'Escape') close(false) }
	document.addEventListener('keydown', onKey)
	root.querySelector('[data-role="backdrop"]').addEventListener('click', (e) => { if (e.target === e.currentTarget) close(false) })
	root.querySelector('[data-role="cancel"]').addEventListener('click', () => close(false))
	root.querySelector('[data-role="confirm"]').addEventListener('click', () => close(true))
})

const api = async (path, options = {}) => {
	const response = await fetch(path, { credentials: 'include', cache: 'no-store', ...options })
	if (response.status === 401) {
		showLogin()
		throw new Error('unauthorized')
	}
	const isJson = response.headers.get('content-type')?.includes('application/json')
	const data = isJson ? await response.json().catch(() => null) : null
	if (!response.ok) {
		const validationMessages = data?.error?.fieldErrors
			? Object.values(data.error.fieldErrors).flat().filter((message) => typeof message === 'string')
			: []
		const formMessages = Array.isArray(data?.error?.formErrors)
			? data.error.formErrors.filter((message) => typeof message === 'string')
			: []
		const message = typeof data?.error === 'string'
			? data.error
			: [...validationMessages, ...formMessages].join(' ') || 'Coś poszło nie tak. Spróbuj ponownie.'
		throw new Error(message)
	}
	return data
}

const uploadFile = async (file, folder) => {
	const formData = new FormData()
	formData.append('file', file)
	formData.append('folder', folder)
	const data = await api('/api/uploads', { method: 'POST', body: formData })
	return data.url
}

const wireDropzone = (container, { multiple, onUploaded }) => {
	const tpl = $('#tpl-dropzone').content.cloneNode(true)
	container.appendChild(tpl)
	const dz = container.querySelector('.dropzone')
	const input = dz.querySelector('.dz-input')
	const idle = dz.querySelector('.dz-idle')
	const loading = dz.querySelector('.dz-loading')
	if (multiple) input.setAttribute('multiple', '')

	const setLoading = (isLoading) => {
		idle.classList.toggle('hidden', isLoading)
		loading.classList.toggle('hidden', !isLoading)
		loading.classList.toggle('flex', isLoading)
	}

	const handleFiles = async (files) => {
		if (!files || files.length === 0) return
		setLoading(true)
		try {
			const urls = []
			for (const file of files) urls.push(await uploadFile(file, dz.dataset.folder || 'misc'))
			await onUploaded(urls)
		} catch (err) {
			showToast(err.message || 'Nie udało się przesłać zdjęcia.', 'error')
		} finally {
			setLoading(false)
			input.value = ''
		}
	}

	dz.addEventListener('click', () => input.click())
	dz.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click() } })
	dz.setAttribute('tabindex', '0')
	input.addEventListener('change', () => handleFiles(input.files))
	;['dragenter', 'dragover'].forEach((evt) => dz.addEventListener(evt, (e) => { e.preventDefault(); dz.classList.add('border-brand-400', 'bg-brand-50/40') }))
	;['dragleave', 'drop'].forEach((evt) => dz.addEventListener(evt, (e) => { e.preventDefault(); dz.classList.remove('border-brand-400', 'bg-brand-50/40') }))
	dz.addEventListener('drop', (e) => handleFiles(multiple ? e.dataTransfer.files : [e.dataTransfer.files[0]]))

	return dz
}

// Generic add/remove row editor for a list of plain strings (video URLs,
// highlight bullet points, ...). Renders into `rowsHost`, wires the "add"
// button, and returns `{ values() }` to read current (trimmed) values.
const wireRowEditor = (rowsHost, addBtn, initial, placeholder, inputType) => {
	let items = [...initial]
	if (items.length === 0) items = ['']

	const draw = () => {
		rowsHost.innerHTML = items.map((value, i) => `
			<div class="flex items-center gap-2">
				<input type="${inputType}" data-i="${i}" placeholder="${placeholder}" value="${escapeHtml(value)}" class="row-input flex-1 border border-slate-300 rounded-lg px-3.5 py-2.5 text-[15px] outline-none focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30 min-h-[44px]">
				<button type="button" data-i="${i}" class="row-remove shrink-0 w-11 h-11 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors duration-150" aria-label="Usuń">×</button>
			</div>
		`).join('')
		rowsHost.querySelectorAll('.row-input').forEach((input) => {
			input.addEventListener('input', () => { items[Number(input.dataset.i)] = input.value })
		})
		rowsHost.querySelectorAll('.row-remove').forEach((btn) => {
			btn.addEventListener('click', () => {
				items.splice(Number(btn.dataset.i), 1)
				if (items.length === 0) items = ['']
				draw()
			})
		})
	}
	draw()
	addBtn.addEventListener('click', () => { items.push(''); draw() })

	return { values: () => items.map((v) => v.trim()) }
}
const wireUrlRowEditor = (rowsHost, addBtn, initial, placeholder) => wireRowEditor(rowsHost, addBtn, initial, placeholder, 'url')
const wireTextRowEditor = (rowsHost, addBtn, initial, placeholder) => wireRowEditor(rowsHost, addBtn, initial, placeholder, 'text')

const showLogin = () => {
	$('#login-view').classList.remove('hidden')
	$('#panel-view').classList.add('hidden')
}

const showPanelShell = () => {
	$('#login-view').classList.add('hidden')
	$('#panel-view').classList.remove('hidden')
}

let activeTab = 'dashboard'
const closeMobileNav = () => {
	$('#mobile-nav').classList.add('hidden')
	$('#menu-btn').setAttribute('aria-expanded', 'false')
}
const setActiveTab = (tab) => {
	activeTab = tab
	$$('.tab-btn').forEach((btn) => {
		const isActive = btn.dataset.tab === tab
		btn.classList.toggle('bg-white', isActive)
		btn.classList.toggle('shadow-soft', isActive)
		btn.classList.toggle('text-brand-800', isActive)
		btn.classList.toggle('text-slate-500', !isActive)
	})
	$$('.tab-btn-mobile').forEach((btn) => {
		const isActive = btn.dataset.tab === tab
		btn.classList.toggle('bg-brand-50', isActive)
		btn.classList.toggle('text-brand-800', isActive)
		btn.classList.toggle('text-slate-600', !isActive)
	})
	$$('.tab-panel').forEach((panel) => panel.classList.toggle('hidden', panel.id !== `tab-${tab}`))
	closeMobileNav()
	render()
}

$$('.tab-btn, .tab-btn-mobile').forEach((btn) => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)))
$('#menu-btn').addEventListener('click', () => {
	const isOpen = !$('#mobile-nav').classList.contains('hidden')
	$('#mobile-nav').classList.toggle('hidden', isOpen)
	$('#menu-btn').setAttribute('aria-expanded', String(!isOpen))
})

// ---------- Dashboard ----------

const renderDashboard = () => {
	const el = $('#tab-dashboard')
	const counts = state.properties.reduce((acc, p) => { acc[p.status] = (acc[p.status] || 0) + 1; return acc }, {})
	const published = state.posts.filter((p) => p.published).length
	const stat = (label, value, accent) => `
		<div class="bg-white rounded-2xl shadow-soft p-5 anim-fade-in-up">
			<p class="text-sm text-slate-500">${label}</p>
			<p class="font-display text-3xl font-semibold ${accent} mt-1 tabular">${value}</p>
		</div>
	`
	el.innerHTML = `
		<h1 class="font-display text-2xl font-semibold text-brand-900 mb-1">Podsumowanie</h1>
		<p class="text-slate-500 mb-6">Aktualny stan treści w panelu.</p>
		<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10">
			${stat('Nieruchomości', state.properties.length, 'text-brand-800')}
			${stat('Dostępne', counts.dostepna || 0, 'text-brand-800')}
			${stat('Zarezerwowane', counts.zarezerwowana || 0, 'text-amber-700')}
			${stat('Wpisy na blogu (opubl.)', `${published}/${state.posts.length}`, 'text-brand-800')}
			${stat('Opinie', state.reviews.length, 'text-brand-800')}
		</div>
		<h2 class="font-display text-lg font-semibold text-brand-900 mb-3">Ostatnio dodane nieruchomości</h2>
		<div class="bg-white rounded-2xl shadow-soft divide-y divide-slate-100">
			${state.properties.length === 0 ? '<p class="p-5 text-sm text-slate-500">Brak nieruchomości — dodaj pierwszą w zakładce „Nieruchomości”.</p>' :
				state.properties.slice(0, 5).map((p) => `
					<div class="flex items-center justify-between gap-4 p-4">
						<div class="min-w-0">
							<p class="font-medium text-slate-800 truncate">${escapeHtml(p.title)}</p>
							<p class="text-sm text-slate-500">${fmtDate(p.createdAt)}</p>
						</div>
						<div class="flex items-center gap-3 shrink-0">
							<span class="text-sm font-medium tabular">${fmtPrice(p.price)}</span>
							<span class="text-xs font-medium px-2.5 py-1 rounded-full ${statusMeta[p.status].cls}">${statusMeta[p.status].label}</span>
						</div>
					</div>
				`).join('')}
		</div>
	`
}

const escapeHtml = (value) => (value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

// Defense-in-depth: every URL we render (image src, file href) is expected to
// be a same-origin path our own /api/uploads returned. Reject anything else
// (javascript:, data:, or any other scheme) before it ever reaches the DOM,
// then escape it for safe attribute interpolation.
const safeUrl = (value) => {
	if (typeof value !== 'string') return ''
	if (/^\/api\/images\/[a-zA-Z0-9_./-]+$/.test(value)) return escapeHtml(value)
	return ''
}

// ---------- Properties ----------

const loadProperties = async () => { state.properties = await api('/api/properties') }

const renderProperties = () => {
	const el = $('#tab-properties')
	el.innerHTML = `
		<div class="flex items-center justify-between mb-6">
			<div>
				<h1 class="font-display text-2xl font-semibold text-brand-900">Nieruchomości</h1>
				<p class="text-slate-500">${state.properties.length} pozycji</p>
			</div>
			<button id="new-property-btn" class="bg-brand-700 text-white rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-brand-600 active:bg-brand-800 transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">
				+ Dodaj nieruchomość
			</button>
		</div>
		<div id="property-form-slot" class="mb-6"></div>
		<div id="property-list" class="grid gap-4 sm:grid-cols-2"></div>
	`
	$('#new-property-btn').addEventListener('click', () => renderPropertyForm())
	const list = $('#property-list')
	if (state.properties.length === 0) {
		list.innerHTML = `<div class="sm:col-span-2 bg-white rounded-2xl shadow-soft p-10 text-center text-slate-500">Brak nieruchomości. Kliknij „Dodaj nieruchomość”, aby dodać pierwszą.</div>`
		return
	}
	for (const property of state.properties) list.appendChild(renderPropertyCard(property))
}

const renderPropertyForm = () => {
	const slot = $('#property-form-slot')
	const pendingImages = []
	slot.innerHTML = `
		<form id="create-property-form" class="bg-white rounded-2xl shadow-soft p-6 anim-fade-in-up space-y-4">
			<h2 class="font-display text-lg font-semibold text-brand-900">Nowa nieruchomość</h2>
			<div class="grid sm:grid-cols-2 gap-4">
				<div class="sm:col-span-2">
					<label class="block text-sm font-medium text-slate-700 mb-1.5" for="cp-title">Tytuł *</label>
					<input id="cp-title" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-[15px] outline-none focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30">
				</div>
				<div>

const ratingPicker = (id, value = 5) => `
	<div id="${id}" class="rating-picker inline-flex items-center gap-1" data-value="${value}" role="radiogroup" aria-label="Ocena">
		${[1, 2, 3, 4, 5].map((i) => `
			<button type="button" data-rate="${i}" class="rating-star p-1.5 rounded-lg hover:bg-gold-500/10 transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-brand-700" role="radio" aria-checked="${i === value}" aria-label="${i} z 5">
				${starsSvg(i <= value)}
			</button>
		`).join('')}
	</div>
`
const wireRatingPicker = (root) => {
	const picker = root.querySelector('.rating-picker')
	picker.querySelectorAll('.rating-star').forEach((btn) => {
		btn.addEventListener('click', () => {
			const value = Number(btn.dataset.rate)
			picker.dataset.value = String(value)
			picker.querySelectorAll('.rating-star').forEach((b) => {
				const filled = Number(b.dataset.rate) <= value
				b.setAttribute('aria-checked', String(Number(b.dataset.rate) === value))
				b.innerHTML = starsSvg(filled)
			})
		})
	})
	return picker
}

			<div>
				<label class="block text-sm font-medium text-slate-700 mb-1.5" for="cd-content">Treść</label>
				<textarea id="cd-content" rows="4" placeholder="Wklej tekst wiedzy (FAQ, oferta, zasady...)." class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-[15px] outline-none focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30"></textarea>
			</div>
			<div>
				<label class="block text-sm font-medium text-slate-700 mb-1.5">Załącznik (opcjonalnie)</label>
				<div id="cd-dropzone-slot" class="max-w-xs"></div>
				<div id="cd-file" class="text-xs text-slate-500 mt-1.5"></div>
			</div>
			<div class="flex items-center gap-2">
				<button type="submit" id="cd-submit" class="bg-brand-700 text-white rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-brand-600 active:bg-brand-800 transition-colors duration-150 disabled:opacity-50">Zapisz dokument</button>
				<button type="button" id="cd-cancel" class="px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors duration-150">Anuluj</button>
			</div>
		</form>
	`
	const dz = wireDropzone($('#cd-dropzone-slot'), {
		multiple: false,
		onUploaded: async ([url]) => {
			fileUrl = url
			fileName = url.split('/').pop()
			$('#cd-file').textContent = `Załączono: ${fileName}`
		},
	})
	dz.dataset.folder = 'chatbot'

	$('#cd-cancel').addEventListener('click', () => { slot.innerHTML = '' })

	$('#cb-doc-form').addEventListener('submit', async (e) => {
		e.preventDefault()
		const btn = $('#cd-submit')
		btn.disabled = true
		btn.textContent = 'Zapisywanie...'
		try {
			const created = await api('/api/chatbot/documents', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					title: $('#cd-title').value,
					content: $('#cd-content').value || undefined,
					fileUrl: fileUrl || undefined,
					fileName: fileName || undefined,
				}),
			})
			showToast('Dokument dodany. Możesz od razu go edytować.')
			slot.innerHTML = ''
			await refreshChatbot({ openId: created.id })
		} catch (err) {
			showToast(err.message, 'error')
			btn.disabled = false
			btn.textContent = 'Zapisz dokument'
		}
	})
}

const renderDocCard = (doc) => {
	const card = document.createElement('div')
	card.className = 'rounded-xl border border-slate-200 p-4 anim-fade-in-up'
	card.dataset.recordId = doc.id
	card.innerHTML = `
		<div class="view-mode flex items-start justify-between gap-3">
			<div class="min-w-0">
				<div class="flex items-center gap-2">
					<h3 class="font-medium text-slate-900 truncate">${escapeHtml(doc.title)}</h3>
					<span class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full ${doc.enabled ? 'bg-brand-100 text-brand-800' : 'bg-slate-200 text-slate-600'}">${doc.enabled ? 'Aktywny' : 'Wyłączony'}</span>
				</div>
				${doc.content ? `<p class="text-sm text-slate-500 mt-1 line-clamp-2">${escapeHtml(doc.content)}</p>` : ''}
				${doc.fileName ? `<a href="${safeUrl(doc.fileUrl)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs text-brand-700 hover:text-brand-800 mt-1.5">📎 ${escapeHtml(doc.fileName)}</a>` : ''}
				<div class="flex items-center gap-2 mt-3">
					<button data-action="edit" class="text-sm font-medium text-brand-700 hover:text-brand-800 px-2.5 py-1.5 rounded-lg hover:bg-brand-50 transition-colors duration-150">Edytuj</button>
					<button data-action="toggle" class="text-sm font-medium text-slate-600 hover:text-slate-800 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 transition-colors duration-150">${doc.enabled ? 'Wyłącz' : 'Włącz'}</button>
					<button data-action="delete" class="text-sm font-medium text-rose-600 hover:text-rose-700 px-2.5 py-1.5 rounded-lg hover:bg-rose-50 transition-colors duration-150">Usuń</button>
				</div>
			</div>
		</div>
		<div class="edit-mode hidden space-y-3"></div>
	`

	card.querySelector('[data-action="toggle"]').addEventListener('click', async () => {
		try {
			await api(`/api/chatbot/documents/${doc.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !doc.enabled }) })
			await refreshChatbot()
		} catch (err) {
			showToast(err.message, 'error')
		}
	})

	card.querySelector('[data-action="delete"]').addEventListener('click', async () => {
		const ok = await confirmDialog(`Usunąć dokument „${escapeHtml(doc.title)}”?`)
		if (!ok) return
		try {
			await api(`/api/chatbot/documents/${doc.id}`, { method: 'DELETE' })
			showToast('Dokument usunięty.')
			await refreshChatbot({ focusId: doc.id })
		} catch (err) {
			showToast(err.message, 'error')
		}
	})

	card.querySelector('[data-action="edit"]').addEventListener('click', () => renderDocEditForm(card, doc))

	return card
}

const renderDocEditForm = (card, doc) => {
	card.querySelector('.view-mode').classList.add('hidden')
	const editEl = card.querySelector('.edit-mode')
	editEl.classList.remove('hidden')
	editEl.innerHTML = `
		<div>
			<label class="block text-xs font-medium text-slate-600 mb-1">Tytuł</label>
			<input class="de-title w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30" value="${escapeHtml(doc.title)}">
		</div>
		<div>
			<label class="block text-xs font-medium text-slate-600 mb-1">Treść</label>
			<textarea rows="5" class="de-content w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus-visible:border-brand-500 focus-visible:ring-2 focus-visible:ring-brand-500/30">${escapeHtml(doc.content)}</textarea>
		</div>
		<div class="flex items-center gap-2">
			<button data-action="save" class="bg-brand-700 text-white rounded-lg px-3.5 py-2 text-sm font-medium hover:bg-brand-600 transition-colors duration-150 disabled:opacity-50">Zapisz</button>
			<button data-action="cancel" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors duration-150">Anuluj</button>
		</div>
	`
	editEl.querySelector('[data-action="cancel"]').addEventListener('click', () => {
		editEl.classList.add('hidden')
		card.querySelector('.view-mode').classList.remove('hidden')
	})
	editEl.querySelector('[data-action="save"]').addEventListener('click', async (e) => {
		const btn = e.currentTarget
		btn.disabled = true
		btn.textContent = 'Zapisywanie...'
		try {
			await api(`/api/chatbot/documents/${doc.id}`, {
				method: 'PATCH',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ title: editEl.querySelector('.de-title').value, content: editEl.querySelector('.de-content').value || undefined }),
			})
			showToast('Zapisano zmiany.')
			await refreshChatbot({ focusId: doc.id })
		} catch (err) {
			showToast(err.message, 'error')
			btn.disabled = false
			btn.textContent = 'Zapisz'
		}
	})
}

const refreshChatbot = async ({ openId, focusId } = {}) => {
	await loadChatbot()
	if (activeTab === 'chatbot') renderChatbot()
	focusRecord(focusId)
	openCreatedRecord(openId)
}

const appendChatMessage = (role, content) => {
	const log = $('#cb-chat-log')
	if (!log) return
	const wrap = document.createElement('div')
	const mine = role === 'user'
	wrap.className = `flex ${mine ? 'justify-end' : 'justify-start'}`
	wrap.innerHTML = `<div class="max-w-[85%] rounded-2xl px-3.5 py-2 ${mine ? 'bg-brand-700 text-white' : 'bg-white border border-slate-200 text-slate-800'}">${escapeHtml(content)}</div>`
	log.appendChild(wrap)
	log.scrollTop = log.scrollHeight
}

const renderTestChat = () => {
	const log = $('#cb-chat-log')
	log.innerHTML = ''
	const greeting = state.chatbotConfig?.greeting
	if (testChatLog.length === 0 && greeting) appendChatMessage('assistant', greeting)
	for (const m of testChatLog) appendChatMessage(m.role, m.content)

	$('#cb-chat-form').addEventListener('submit', async (e) => {
		e.preventDefault()
		const input = $('#cb-chat-input')
		const text = input.value.trim()
		if (!text) return
		input.value = ''
		testChatLog.push({ role: 'user', content: text })
		appendChatMessage('user', text)
		const btn = $('#cb-chat-send')
		btn.disabled = true
		try {
			const data = await api('/api/chatbot/test-chat', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ messages: testChatLog }),
			})
			testChatLog.push({ role: 'assistant', content: data.reply })
			appendChatMessage('assistant', data.reply)
		} catch (err) {
			appendChatMessage('assistant', `⚠️ ${err.message}`)
		} finally {
			btn.disabled = false
		}
	})
}

// ---------- Bootstrap ----------

const render = () => {
	if (activeTab === 'dashboard') renderDashboard()
	if (activeTab === 'properties') renderProperties()
	if (activeTab === 'reviews') renderReviews()
	if (activeTab === 'blog') renderBlog()
	if (activeTab === 'chatbot') renderChatbot()
}

const refreshAll = async () => {
	await Promise.all([loadProperties(), loadPosts(), loadReviews(), loadChatbot()])
	render()
}

const openCreatedRecord = (id) => {
	if (!id) return
	requestAnimationFrame(() => {
		const card = focusRecord(id)
		if (!card) return
		card.querySelector('[data-action="edit"]')?.click()
	})
}

const focusRecord = (id) => {
	if (!id) return null
	const card = document.querySelector(`[data-record-id="${CSS.escape(id)}"]`)
	if (!card) return null
	card.scrollIntoView({ behavior: 'smooth', block: 'center' })
	card.classList.add('ring-2', 'ring-brand-400', 'ring-offset-2')
	setTimeout(() => card.classList.remove('ring-2', 'ring-brand-400', 'ring-offset-2'), 1800)
	return card
}

const refreshProperties = async ({ openId, focusId } = {}) => {
	await loadProperties()
	render()
	focusRecord(focusId)
	openCreatedRecord(openId)
}

const refreshReviews = async ({ openId, focusId } = {}) => {
	await loadReviews()
	render()
	focusRecord(focusId)
	openCreatedRecord(openId)
}

const refreshPosts = async ({ openId, focusId } = {}) => {
	await loadPosts()
	render()
	focusRecord(focusId)
	openCreatedRecord(openId)
}

$('#login-form').addEventListener('submit', async (event) => {
	event.preventDefault()
	const errorEl = $('#login-error')
	const submitBtn = $('#login-submit')
	errorEl.classList.add('hidden')
	submitBtn.disabled = true
	submitBtn.textContent = 'Logowanie...'
	try {
		const response = await fetch('/api/login', {
			method: 'POST',
			credentials: 'include',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ email: $('#login-email').value, password: $('#login-password').value }),
		})
		if (!response.ok) throw new Error()
		const data = await response.json()
		state.userEmail = data.user?.email || $('#login-email').value
		showPanelShell()
		setActiveTab('dashboard')
		await refreshAll()
	} catch {
		errorEl.textContent = 'Nieprawidłowy email lub hasło.'
		errorEl.classList.remove('hidden')
	} finally {
		submitBtn.disabled = false
		submitBtn.textContent = 'Zaloguj się'
	}
})

$('#logout-btn').addEventListener('click', async () => {
	await fetch('/api/logout', { method: 'POST', credentials: 'include' })
	showLogin()
})

;(async () => {
	try {
		const me = await fetch('/api/me', { credentials: 'include', cache: 'no-store' })
		if (me.status === 401) { showLogin(); return }
		const meData = await me.json()
		state.userEmail = meData.email
		await refreshAll()
		showPanelShell()
		setActiveTab('dashboard')
	} catch {
		showLogin()
	}
})()
</script>
