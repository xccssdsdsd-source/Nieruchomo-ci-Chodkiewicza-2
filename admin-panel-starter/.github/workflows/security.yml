name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@3434fbbc53af0fe47685ef3897703b39ef77b5cb
        with:
          languages: javascript-typescript
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - uses: github/codeql-action/analyze@3434fbbc53af0fe47685ef3897703b39ef77b5cb

  sast-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: python -m pip install semgrep==1.171.0
      - run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/secrets --error .
      - uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
